[project]
name = "dora-compliance-agent"
version = "0.1.0"
description = "DORA Compliance Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.111.0",
    "mistralai>=2.8.0",
    "pytest>=9.1.1",
    "sentence-transformers>=5.6.0",
]

[tool.pytest.ini_options]
addopts = ["-vv"]
pythonpath = ["."]
testpaths = ["tests"]
