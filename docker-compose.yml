services:
  chromadb:
    image: "chromadb/chroma:latest"
    container_name: "chroma-database"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  streamlit-app:
    image: "compliance-app:latest"
    container_name: "streamlit-app"
    platform: linux/amd64
    ports:
      - "7860:7860"
    environment:
      - CHROMA_MODE=network
      - CHROMA_HOST=chroma-database
      - CHROMA_PORT=8000
      - MISTRAL_KEY=${MISTRAL_KEY}
    depends_on:
      - chromadb

volumes:
  chromadb_data:
    driver: local
